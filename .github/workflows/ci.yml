name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Explicitly restrict permissions to the minimum required by this workflow
permissions:
  contents: read # for actions/checkout to fetch the repository
  actions: write # for actions/upload-artifact to upload the dist/ folder and bun manage dependency caching

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    name: Build (ARM64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run biome:check

      - name: Run Astro check
        run: bun astro check

      - name: Build site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
